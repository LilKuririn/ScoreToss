  <!-- ============ YAMS : PRÉPARATION ============ -->
  <section class="screen" id="s-ysetup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <button type="button" class="crumb" id="yaToGames">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M7.5 2L3.5 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="games.change">Changer de jeu</span>
          </button>
          <h1><span data-i18n="ya.name">Yams</span><span>.</span></h1>
        </div>
        <div class="nav">
          <button type="button" class="nav-btn" id="yaHall" hidden data-i18n-aria="hall.aria">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.6 15V9.2M9 15V3.4M14.4 15v-3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M1.8 15h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="setup-body">
      <div class="tcount">
        <div>
          <p class="eyebrow" data-i18n="ya.players">Joueurs</p>
          <p class="note" id="yaNote">2 joueurs · 13 tours</p>
        </div>
        <div class="step wide">
          <button type="button" id="yaMinus" data-i18n-aria="ya.remove">−</button>
          <div class="v" id="yaVal">2</div>
          <button type="button" id="yaPlus" data-i18n-aria="ya.add">+</button>
        </div>
      </div>

      <div id="yaRows" class="ya-rows"></div>

      <div class="link-group">
        <button type="button" class="hall-link" id="yaOpenRules">
          <span>
            <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
            <b data-i18n="setup.rules.label">Comment marquer des points</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" class="hall-link" id="yaOpenAbout">
          <span>
            <span class="eyebrow" data-i18n="setup.about.eyebrow">À propos</span>
            <b data-i18n="setup.about.label">Réglages, sauvegarde et langue</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="yaStart" data-i18n="setup.start">Commencer la partie</button>
    </footer>
  </section>

  <!-- ============ YAMS : PARTIE ============ -->
  <section class="screen" id="s-ygame">
    <header class="top">
      <p class="eyebrow" id="yaTurn">À vous</p>
      <div class="sep"></div>
      <p class="eyebrow" id="yaTourLabel">Tour 1 / 13</p>
      <button type="button" class="icon-btn" id="yaSheetBtn" data-i18n-aria="sheet.title">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 4h13M2.5 9h13M2.5 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="ya-scores" id="yaScores"></div>

    <section class="ya-console">
      <div class="ya-saisie">
        <div class="ya-tete">
          <p class="eyebrow" id="yaDesLab">0 / 5</p>
          <button type="button" class="ya-effacer" id="yaEffacer" data-i18n="ya.clear">Effacer</button>
        </div>
        <div class="ya-des" id="yaDes" aria-live="polite"></div>
        <div class="ya-pave" id="yaPave"></div>
      </div>

      <div class="ya-fiche" id="yaFiche"></div>

      <button type="button" class="cta ya-valider" id="yaValider" disabled data-i18n="ya.enter">Saisissez les 5 dés</button>
    </section>

    <!-- feuille de match -->
    <div class="sheet-wrap" id="yaSheetWrap">
      <div class="scrim" id="yaScrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" data-i18n-aria="sheet.title">
        <div class="sheet-head">
          <h3 data-i18n="sheet.title">Feuille de match</h3>
          <button type="button" class="icon-btn" id="yaSheetClose" data-i18n-aria="nav.close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body" id="yaSheetBody"></div>
        <div class="sheet-acts">
          <button type="button" class="act" id="yaEdSave" hidden data-i18n="edit.save">Enregistrer la correction</button>
          <button type="button" class="act" id="yaUndo" data-i18n="ya.undo">Annuler le dernier tour</button>
          <button type="button" class="act danger" id="yaQuit" data-i18n="sheet.quit">Terminer la partie</button>
        </div>
      </div>
    </div>
  </section>
