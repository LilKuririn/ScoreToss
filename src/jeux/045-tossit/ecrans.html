  <!-- ============ TOSSIT : PRÉPARATION ============ -->
  <section class="screen" id="s-isetup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <button type="button" class="crumb" id="tiToGames">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M7.5 2L3.5 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="games.change">Changer de jeu</span>
          </button>
          <h1><span data-i18n="ti.name">Tossit</span><span>.</span></h1>
        </div>
        <div class="nav">
          <button type="button" class="nav-btn" id="tiHall" hidden data-i18n-aria="hall.aria">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.6 15V9.2M9 15V3.4M14.4 15v-3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M1.8 15h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="setup-body">
      <div class="seg" id="tiMode">
        <button type="button" data-mode="solo" class="on"><span class="lbl" data-i18n="ti.mode.solo">Individuel</span><span class="sub" data-i18n="ti.mode.solo.sub">Chacun pour soi</span></button>
        <button type="button" data-mode="team"><span class="lbl" data-i18n="ti.mode.team">Équipes</span><span class="sub" data-i18n="ti.mode.team.sub">Score commun</span></button>
      </div>

      <div class="panel-block">
        <div class="opt">
          <p class="eyebrow" data-i18n="ti.darts">Fléchettes chacun</p>
          <div class="opt-row" id="tiDarts"></div>
          <p class="hint" data-i18n="ti.darts.hint">Le joueur 1 lance le jack en premier : le plus âgé, dit la règle.</p>
        </div>
      </div>

      <div class="tcount">
        <div>
          <p class="eyebrow" id="tiCountLab" data-i18n="ti.players">Joueurs</p>
          <p class="note" id="tiNote">2 joueurs · premier à 13</p>
        </div>
        <div class="step wide">
          <button type="button" id="tiMinus" data-i18n-aria="tour.remove">−</button>
          <div class="v" id="tiVal">2</div>
          <button type="button" id="tiPlus" data-i18n-aria="tour.add">+</button>
        </div>
      </div>

      <div class="tcount" id="tiPerBlock" hidden>
        <div><p class="eyebrow" data-i18n="ti.per">Joueurs par équipe</p></div>
        <div class="step wide">
          <button type="button" id="tiPerMinus" data-i18n-aria="tour.remove">−</button>
          <div class="v" id="tiPerVal">2</div>
          <button type="button" id="tiPerPlus" data-i18n-aria="tour.add">+</button>
        </div>
      </div>

      <div id="tiRows" class="ti-rows"></div>

      <div class="link-group">
        <button type="button" class="hall-link" id="tiOpenRules">
          <span>
            <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
            <b data-i18n="setup.rules.label">Comment marquer des points</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" class="hall-link" id="tiOpenAbout">
          <span>
            <span class="eyebrow" data-i18n="setup.about.eyebrow">À propos</span>
            <b data-i18n="setup.about.label">Réglages, sauvegarde et langue</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="tiStart" data-i18n="setup.start">Commencer la partie</button>
    </footer>
  </section>

  <!-- ============ TOSSIT : PARTIE ============ -->
  <section class="screen" id="s-igame">
    <header class="top">
      <p class="eyebrow" id="tiMancheLabel">Manche 1</p>
      <div class="sep"></div>
      <p class="eyebrow" id="tiCibleLabel">Objectif 13</p>
      <button type="button" class="toss" id="tiTirer" hidden data-i18n="order.draw">Tirer l'ordre</button>
      <button type="button" class="icon-btn" id="tiSheetBtn" data-i18n-aria="sheet.title">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 4h13M2.5 9h13M2.5 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="ti-scores" id="tiScores"></div>

    <div class="ti-zone">
      <div class="ti-apercu vide" id="tiApercu" aria-live="polite"></div>
    </div>

    <section class="console">
      <div class="ti-types" id="tiTypes"></div>
      <div class="ti-corps" id="tiCorps"></div>
      <div class="settle">
        <p class="outcome" id="tiOutcome"></p>
        <button type="button" class="validate" id="tiValider" data-i18n="game.validate">Valider</button>
      </div>
    </section>

    <!-- feuille de match -->
    <div class="sheet-wrap" id="tiSheetWrap">
      <div class="scrim" id="tiScrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" data-i18n-aria="sheet.title">
        <div class="sheet-head">
          <h3 data-i18n="sheet.title">Feuille de match</h3>
          <button type="button" class="icon-btn" id="tiSheetClose" data-i18n-aria="nav.close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body" id="tiSheetBody"></div>
        <div class="sheet-acts">
          <button type="button" class="act" id="tiEdSave" hidden data-i18n="edit.save">Enregistrer la correction</button>
          <button type="button" class="act danger" id="tiEdDel" hidden data-i18n="edit.delete">Supprimer cette manche</button>
          <button type="button" class="act" id="tiUndo" data-i18n="sheet.undo">Annuler la dernière manche</button>
          <button type="button" class="act danger" id="tiQuit" data-i18n="sheet.quit">Terminer la partie</button>
        </div>
      </div>
    </div>
  </section>
