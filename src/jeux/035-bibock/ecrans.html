  <!-- ============ BIBOCK : PRÉPARATION ============ -->
  <section class="screen" id="s-bsetup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <button type="button" class="crumb" id="biToGames">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M7.5 2L3.5 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="games.change">Changer de jeu</span>
          </button>
          <h1><span data-i18n="bi.name">Bibock</span><span>.</span></h1>
        </div>
        <div class="nav">
          <button type="button" class="nav-btn" id="biHall" hidden data-i18n-aria="hall.aria">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.6 15V9.2M9 15V3.4M14.4 15v-3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M1.8 15h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="setup-body">
      <div class="tcount">
        <div>
          <p class="eyebrow" data-i18n="bi.per">Joueurs par équipe</p>
          <p class="note" id="biNote">1 contre 1 · 4 Bocks chacune</p>
        </div>
        <div class="step wide">
          <button type="button" id="biPerMinus" data-i18n-aria="bi.remove">−</button>
          <div class="v" id="biVal">1</div>
          <button type="button" id="biPerPlus" data-i18n-aria="bi.add">+</button>
        </div>
      </div>

      <div class="panel-block">
        <div class="opt">
          <p class="eyebrow" data-i18n="bi.cible">Score à atteindre</p>
          <div class="opt-row" id="biCible"></div>
          <p class="hint" data-i18n="bi.cible.hint">16 points, ou 9 pour la variante express.</p>
        </div>
      </div>

      <div id="biRows" class="bi-equipes"></div>

      <div class="link-group">
        <button type="button" class="hall-link" id="biOpenRules">
          <span>
            <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
            <b data-i18n="setup.rules.label">Comment marquer des points</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" class="hall-link" id="biOpenAbout">
          <span>
            <span class="eyebrow" data-i18n="setup.about.eyebrow">À propos</span>
            <b data-i18n="setup.about.label">Réglages, sauvegarde et langue</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="biStart" data-i18n="setup.start">Commencer la partie</button>
    </footer>
  </section>

  <!-- ============ BIBOCK : PARTIE ============ -->
  <section class="screen" id="s-bgame">
    <header class="top">
      <p class="eyebrow" id="biMancheLabel">Manche 1</p>
      <div class="sep"></div>
      <p class="eyebrow" id="biCibleLabel">Objectif 16</p>
      <button type="button" class="toss" id="biTirer" hidden data-i18n="toss.draw">Tirer au sort</button>
      <button type="button" class="icon-btn" id="biSheetBtn" data-i18n-aria="sheet.title">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 4h13M2.5 9h13M2.5 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="fields" id="biFields"></div>

    <section class="console">
      <div class="console-head">
        <p class="eyebrow" data-i18n="over.points">Points</p>
        <p class="eyebrow" data-i18n="bi.col.pp">Proches ×1</p>
        <p class="eyebrow" data-i18n="bi.col.pm">Maître ×5</p>
      </div>
      <div class="bi-rows" id="biPoints"></div>
      <p class="eyebrow bi-rec-titre" data-i18n="bi.rec">Bocks récupérés</p>
      <div class="bi-rec" id="biRec"></div>
      <div class="settle">
        <p class="outcome" id="biOutcome">Manche nulle</p>
        <button type="button" class="validate" id="biValider" data-i18n="game.validate">Valider</button>
      </div>
    </section>

    <!-- feuille de match -->
    <div class="sheet-wrap" id="biSheetWrap">
      <div class="scrim" id="biScrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" data-i18n-aria="sheet.title">
        <div class="sheet-head">
          <h3 data-i18n="sheet.title">Feuille de match</h3>
          <button type="button" class="icon-btn" id="biSheetClose" data-i18n-aria="nav.close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body" id="biSheetBody"></div>
        <div class="sheet-acts">
          <button type="button" class="act" id="biEdSave" hidden data-i18n="edit.save">Enregistrer la correction</button>
          <button type="button" class="act danger" id="biEdDel" hidden data-i18n="edit.delete">Supprimer cette manche</button>
          <button type="button" class="act" id="biUndo" data-i18n="sheet.undo">Annuler la dernière manche</button>
          <button type="button" class="act danger" id="biQuit" data-i18n="sheet.quit">Terminer la partie</button>
        </div>
      </div>
    </div>
  </section>
