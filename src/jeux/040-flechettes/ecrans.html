  <!-- ============ FLÉCHETTES : PRÉPARATION ============ -->
  <section class="screen" id="s-fsetup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <button type="button" class="crumb" id="flToGames">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M7.5 2L3.5 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="games.change">Changer de jeu</span>
          </button>
          <h1><span data-i18n="fl.name">Fléchettes</span><span>.</span></h1>
        </div>
        <div class="nav">
          <button type="button" class="nav-btn" id="flHall" hidden data-i18n-aria="hall.aria">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.6 15V9.2M9 15V3.4M14.4 15v-3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M1.8 15h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <div class="setup-body">
      <div class="seg" id="flMode">
        <button type="button" data-mode="solo" class="on"><span class="lbl" data-i18n="fl.mode.solo">Individuel</span><span class="sub" data-i18n="fl.mode.solo.sub">Chacun pour soi</span></button>
        <button type="button" data-mode="team"><span class="lbl" data-i18n="fl.mode.team">Équipes</span><span class="sub" data-i18n="fl.mode.team.sub">Score commun</span></button>
      </div>

      <div class="panel-block">
        <div class="opt">
          <p class="eyebrow" data-i18n="fl.depart">Score de départ</p>
          <div class="opt-row" id="flDepart"></div>
          <p class="hint" data-i18n="fl.depart.hint">Fin obligatoire sur un double, en une seule manche.</p>
        </div>
      </div>

      <div class="tcount">
        <div>
          <p class="eyebrow" id="flCountLab" data-i18n="fl.players">Joueurs</p>
          <p class="note" id="flNote">2 joueurs · 501 double out</p>
        </div>
        <div class="step wide">
          <button type="button" id="flMinus" data-i18n-aria="tour.remove">−</button>
          <div class="v" id="flVal">2</div>
          <button type="button" id="flPlus" data-i18n-aria="tour.add">+</button>
        </div>
      </div>

      <div class="tcount" id="flPerBlock" hidden>
        <div><p class="eyebrow" data-i18n="fl.per">Joueurs par équipe</p></div>
        <div class="step wide">
          <button type="button" id="flPerMinus" data-i18n-aria="tour.remove">−</button>
          <div class="v" id="flPerVal">2</div>
          <button type="button" id="flPerPlus" data-i18n-aria="tour.add">+</button>
        </div>
      </div>

      <div id="flRows"></div>

      <div class="link-group">
        <button type="button" class="hall-link" id="flOpenRules">
          <span>
            <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
            <b data-i18n="setup.rules.label">Comment marquer des points</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" class="hall-link" id="flOpenAbout">
          <span>
            <span class="eyebrow" data-i18n="setup.about.eyebrow">À propos</span>
            <b data-i18n="setup.about.label">Réglages, sauvegarde et langue</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="flStart" data-i18n="setup.start">Commencer la partie</button>
    </footer>
  </section>

  <!-- ============ FLÉCHETTES : PARTIE ============ -->
  <section class="screen" id="s-fgame">
    <header class="top">
      <p class="eyebrow" id="flTurn">À vous</p>
      <div class="sep"></div>
      <p class="eyebrow" id="flStartLabel">501 · double out</p>
      <button type="button" class="toss" id="flTirer" hidden data-i18n="order.draw">Tirer l'ordre</button>
      <button type="button" class="icon-btn" id="flSheetBtn" data-i18n-aria="sheet.title">
        <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
          <path d="M2.5 4h13M2.5 9h13M2.5 14h8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </header>

    <div class="fl-scores" id="flScores"></div>

    <section class="fl-console">
      <div class="fl-volee" id="flVolee"></div>
      <div class="fl-vise" aria-live="polite">
        <b id="flVise" class="attente">Visez, puis levez le doigt</b>
        <span class="fl-msg" id="flMsg"></span>
      </div>
      <div class="fl-zone">
        <div class="fl-cible" id="flCible" role="application" data-i18n-aria="fl.board.aria"></div>
      </div>
      <div class="fl-actions">
        <button type="button" class="fl-btn fl-rate" id="flMiss" data-i18n="fl.miss">Raté</button>
        <button type="button" class="fl-btn" id="flCancel" data-i18n="fl.cancel">Annuler la fléchette</button>
      </div>
    </section>

    <!-- feuille de match -->
    <div class="sheet-wrap" id="flSheetWrap">
      <div class="scrim" id="flScrim"></div>
      <div class="sheet" role="dialog" aria-modal="true" data-i18n-aria="sheet.title">
        <div class="sheet-head">
          <h3 data-i18n="sheet.title">Feuille de match</h3>
          <button type="button" class="icon-btn" id="flSheetClose" data-i18n-aria="nav.close">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="sheet-body" id="flSheetBody"></div>
        <div class="fl-editeur" id="flEditeur" hidden>
          <div class="fl-cible" id="flEdCible" role="application" data-i18n-aria="fl.board.aria"></div>
          <button type="button" class="fl-btn fl-rate" id="flEdMiss" data-i18n="fl.miss">Raté</button>
        </div>
        <div class="sheet-acts">
          <button type="button" class="act" id="flEdSave" hidden data-i18n="edit.save">Enregistrer la correction</button>
          <button type="button" class="act danger" id="flEdDel" hidden data-i18n="fl.edit.delete">Supprimer cette fléchette</button>
          <button type="button" class="act danger" id="flQuit" data-i18n="sheet.quit">Terminer la partie</button>
        </div>
      </div>
    </div>
  </section>
