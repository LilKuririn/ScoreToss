<script>
/* Le theme choisi doit etre pose avant que la page peigne quoi que ce soit,
   sinon un theme force clignote au chargement. La cle est repetee ici a
   dessein : ce bloc s'execute bien avant le script principal. */
try{
  var _th = localStorage.getItem("cornhole.theme");
  if(_th==="light" || _th==="dark") document.documentElement.setAttribute("data-theme", _th);
}catch(e){}
</script>
