  <!-- ============ JOUEURS ============ -->
  <section class="screen" id="s-joueurs">
    <header class="brand">
      <div class="brand-row">
        <div>
          <p class="eyebrow" id="jrCount">Carnet</p>
          <h1><span data-i18n="pl.title">Joueurs</span><span>.</span></h1>
        </div>
        <button type="button" class="ghost-btn" id="jrBack" data-i18n="nav.home">Accueil</button>
      </div>
    </header>

    <div class="jr-body">
      <div id="jrListe"></div>
      <p class="hint" data-i18n="pl.hint">Ces noms vous sont proposés dans tous les jeux. Un invité peut toujours être tapé à la main.</p>
    </div>

    <footer class="cta-bar jr-bar">
      <input type="text" class="field-input" id="jrNouveau" maxlength="22" data-i18n-ph="pl.new.ph" data-i18n-aria="pl.new" placeholder="Prénom ou surnom">
      <button type="button" class="cta" id="jrAjouter" data-i18n="pl.add">Ajouter</button>
    </footer>
  </section>

  <!-- la fiche d'un joueur : son nom, sa couleur, ce qu'il a joué -->
  <div class="sheet-wrap" id="jrFiche">
    <div class="scrim" id="jrFicheScrim"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h3 id="jrFicheTitre">Joueur</h3>
        <button type="button" class="icon-btn" id="jrFicheClose" data-i18n-aria="nav.close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="jrFicheBody"></div>
    </div>
  </div>

  <!-- choisir un joueur pour un champ de nom -->
  <div class="sheet-wrap" id="jrWrap">
    <div class="scrim" id="jrScrim"></div>
    <div class="sheet" role="dialog" aria-modal="true" data-i18n-aria="pl.pick">
      <div class="sheet-head">
        <h3 data-i18n="pl.pick">Choisir un joueur</h3>
        <button type="button" class="icon-btn" id="jrClose" data-i18n-aria="nav.close">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M3 3l10 10M13 3L3 13" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <div class="sheet-body" id="jrChoix"></div>
    </div>
  </div>
