  <!-- ============ TOURNOI · PRÉPARATION ============ -->
  <section class="screen" id="s-tsetup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <p class="eyebrow" data-i18n="tour.eyebrow">Élimination directe</p>
          <h1><span data-i18n="tour.title">Tournoi</span><span>.</span></h1>
        </div>
        <button type="button" class="ghost-btn" id="tsBack" data-i18n="nav.home">Accueil</button>
      </div>
    </header>

    <div class="setup-body">
      <div class="tcount">
        <div>
          <p class="eyebrow" data-i18n="tour.teams">Équipes engagées</p>
          <p class="note" id="tcNote">Tableau à 4 · aucune exemption</p>
        </div>
        <div class="step wide" id="tcStep">
          <button type="button" id="tcMinus" data-i18n-aria="tour.remove">−</button>
          <div class="v" id="tcVal">4</div>
          <button type="button" id="tcPlus" data-i18n-aria="tour.add">+</button>
        </div>
      </div>

      <div class="seg" id="tmode">
        <button type="button" data-mode="simple" class="on"><span class="lbl" data-i18n="mode.single">Simple</span><span class="sub" data-i18n="mode.single.sub">1 v 1</span></button>
        <button type="button" data-mode="double"><span class="lbl" data-i18n="mode.double">Double</span><span class="sub" data-i18n="mode.double.sub">2 v 2</span></button>
        <button type="button" data-mode="triple" hidden><span class="lbl" data-i18n="mode.triple">Triple</span><span class="sub" data-i18n="mode.triple.sub">3 v 3</span></button>
      </div>

      <div id="trows"></div>

      <div class="panel-block">
        <div class="opt">
          <p class="eyebrow" data-i18n="tour.target">Score à atteindre — tous les matchs</p>
          <div class="opt-row" id="ttarget">
            <button type="button" class="chip" data-target="11">11</button>
            <button type="button" class="chip" data-target="15">15</button>
            <button type="button" class="chip on" data-target="21">21</button>
          </div>
        </div>
      </div>

      <button type="button" class="hall-link" id="openRulesT">
        <span>
          <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
          <b data-i18n="setup.rules.label">Comment marquer des points</b>
        </span>
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="tstart" data-i18n="tour.create">Créer le tableau</button>
    </footer>
  </section>
