  <!-- ============ PRÉPARATION ============ -->
  <section class="screen" id="s-setup">
    <header class="brand">
      <div class="brand-row">
        <div>
          <button type="button" class="crumb" id="backToGames">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true">
              <path d="M7.5 2L3.5 6l4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span data-i18n="games.change">Changer de jeu</span>
          </button>
          <h1 id="setupTitle">Cornhole<span>.</span></h1>
        </div>
        <div class="nav">
          <button type="button" class="nav-btn" id="openHall" hidden data-i18n-aria="hall.aria">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M3.6 15V9.2M9 15V3.4M14.4 15v-3.9" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/>
              <path d="M1.8 15h14.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
          </button>
          <button type="button" class="nav-btn" id="openTour" data-i18n-aria="tour.title">
            <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
              <path d="M2.5 3.5h3.6v5.5h3.5V3.5h3.6M13.2 9h2.3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2.5 14.5h3.6V9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <i class="pip" id="tourPip" hidden></i>
          </button>
        </div>
      </div>
    </header>

    <div class="setup-body">
      <div class="seg" id="mode">
        <button type="button" data-mode="simple" class="on"><span class="lbl" data-i18n="mode.single">Simple</span><span class="sub" data-i18n="mode.single.sub">1 v 1</span></button>
        <button type="button" data-mode="double"><span class="lbl" data-i18n="mode.double">Double</span><span class="sub" data-i18n="mode.double.sub">2 v 2</span></button>
        <button type="button" data-mode="triple" hidden><span class="lbl" data-i18n="mode.triple">Triple</span><span class="sub" data-i18n="mode.triple.sub">3 v 3</span></button>
      </div>

      <div id="cards"></div>

      <div class="panel-block">
        <div class="opt">
          <p class="eyebrow" data-i18n="setup.target">Score à atteindre</p>
          <div class="opt-row" id="target"></div>
          @@jeux:aide-cible.html@@
        </div>
        @@jeux:reglages.html@@
      </div>

      <div class="link-group">
        <button type="button" class="hall-link" id="openRules">
          <span>
            <span class="eyebrow" data-i18n="setup.rules.eyebrow">Règles du jeu</span>
            <b data-i18n="setup.rules.label">Comment marquer des points</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <button type="button" class="hall-link" id="openAbout">
          <span>
            <span class="eyebrow" data-i18n="setup.about.eyebrow">À propos</span>
            <b data-i18n="setup.about.label">Réglages, sauvegarde et langue</b>
          </span>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
            <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
      </div>
    </div>

    <footer class="cta-bar">
      <button type="button" class="cta" id="start" data-i18n="setup.start">Commencer la partie</button>
    </footer>
  </section>
