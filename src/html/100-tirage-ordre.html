  <!-- ============ TIRAGE AU SORT DE L'ORDRE DE JEU ============ -->
  <div class="toss-wrap ordre-wrap" id="ordreWrap" hidden>
    <div class="toss-scrim"></div>
    <div class="toss-box" role="dialog" aria-modal="true" data-i18n-aria="order.who">
      <p class="eyebrow" data-i18n="order.who">Ordre de jeu</p>
      <div class="reel" id="ordreReel">
        <div class="reel-strip" id="ordreStrip"></div>
        <span class="notch l"></span>
        <span class="notch r"></span>
      </div>
      <ol class="ordre-liste" id="ordreListe"></ol>
      <p class="toss-out" id="ordreOut" aria-live="polite" data-i18n="toss.running">Tirage en cours</p>
      <button type="button" class="cta ordre-ok" id="ordreOk" hidden data-i18n="order.ok">C'est parti</button>
    </div>
  </div>
