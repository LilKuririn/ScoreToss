
  <!-- ============ CHOIX DU JEU ============ -->
  <section class="screen on" id="s-games">
    <header class="brand">
      <p class="eyebrow" data-i18n="games.eyebrow">Choisir un jeu</p>
      <h1>ScoreToss<span>.</span></h1>
    </header>

    <div class="games">
      <button type="button" class="tile" id="playCornhole">
        <span class="tile-mark">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="10" y="3.5" width="14" height="27" rx="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="17" cy="11" r="3.2" stroke="currentColor" stroke-width="2"/>
            <rect x="12.6" y="18" width="8" height="8" rx="1.8" fill="#C5551F"
                  transform="rotate(-17 16.6 22)"/>
          </svg>
        </span>
        <span class="tile-txt">
          <span class="tile-name">Cornhole</span>
          <span class="tile-sub" data-i18n="games.cornhole.sub">Simple, double et tournois</span>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button type="button" class="tile" id="playPalet">
        <span class="tile-mark">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="3.5" y="8" width="27" height="19" rx="3" stroke="currentColor" stroke-width="2"/>
            <circle cx="17" cy="17.5" r="2.1" fill="#C5551F"/>
            <circle cx="10.2" cy="21.4" r="3.3" stroke="currentColor" stroke-width="1.7"/>
            <circle cx="23.4" cy="13.4" r="3.3" stroke="currentColor" stroke-width="1.7"/>
          </svg>
        </span>
        <span class="tile-txt">
          <span class="tile-name" data-i18n="palet.name">Palet breton</span>
          <span class="tile-sub" data-i18n="games.palet.sub">Sur planche, simple et double</span>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <button type="button" class="tile" id="playMolkky">
        <span class="tile-mark">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <rect x="5.5" y="15" width="6.4" height="14" rx="2.6" stroke="currentColor" stroke-width="1.8"/>
            <rect x="13.8" y="10" width="6.4" height="19" rx="2.6" stroke="currentColor" stroke-width="1.8"/>
            <rect x="22.1" y="17" width="6.4" height="12" rx="2.6" stroke="currentColor" stroke-width="1.8"/>
            <rect x="19" y="3" width="11" height="3.6" rx="1.8" fill="#C5551F"
                  transform="rotate(28 24.5 4.8)"/>
          </svg>
        </span>
        <span class="tile-txt">
          <span class="tile-name" data-i18n="molkky.name">Mölkky</span>
          <span class="tile-sub" data-i18n="games.molkky.sub">À plusieurs, quilles numérotées</span>
        </span>
        <svg class="chev" width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <path d="M6 3.5L10.5 8L6 12.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>

      <div class="tile soon" aria-disabled="true">
        <span class="tile-mark">
          <svg width="34" height="34" viewBox="0 0 34 34" fill="none" aria-hidden="true">
            <circle cx="11.5" cy="21" r="5" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="22.5" cy="21" r="5" stroke="currentColor" stroke-width="1.8"/>
            <circle cx="17" cy="12" r="5" stroke="currentColor" stroke-width="1.8"/>
          </svg>
        </span>
        <span class="tile-txt">
          <span class="soon-chip" data-i18n="games.soon">En chantier</span>
          <span class="tile-sub" data-i18n="games.soon.sub">Pétanque, bibock…</span>
        </span>
      </div>
    </div>
  </section>
