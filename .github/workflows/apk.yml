name: APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'manifest.webmanifest'
      - 'icon-*.png'
      - 'apple-touch-icon.png'
      - 'android/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Le nom de version vient de `APP_VERSION`, dans index.html : une seule
      # source de vérité. Recopié ici, il finissait par dériver de ce que
      # l'écran *À propos* affiche.
      - name: Nom de version
        id: v
        run: |
          vn=$(sed -n 's/^var APP_VERSION *= *"\([^"]*\)".*/\1/p' index.html | head -1)
          if [ -z "$vn" ]; then
            echo "APP_VERSION introuvable dans index.html" >&2
            exit 1
          fi
          echo "vn=$vn" >> "$GITHUB_OUTPUT"
          echo "Nom de version : $vn.${{ github.run_number }}"

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Clé de signature
        run: |
          if [ ! -f android/debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore android/debug.keystore \
              -storepass cornscore -keypass cornscore -alias cornscore \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Cornscore, OU=Sideload, O=Cornscore, C=FR"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f android/debug.keystore
            git commit -m "Ajouter la clé de signature de l'APK [skip ci]"
            git push
          fi

      - name: Plateforme Android
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" "build-tools;36.0.0" > /dev/null || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.14.5'

      - name: Construire l'APK installable
        working-directory: android
        run: |
          set -o pipefail
          gradle assembleDebug --no-daemon --stacktrace \
            -Pvc=${{ github.run_number }} \
            -Pvn=${{ steps.v.outputs.vn }}.${{ github.run_number }} 2>&1 | tee ../build.log

      - name: Journal en cas d'échec
        if: failure()
        run: |
          mkdir -p .ci
          tail -c 60000 build.log > .ci/last-build.log 2>/dev/null || echo "pas de journal" > .ci/last-build.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash || true
          git add -f .ci/last-build.log
          git commit -m "Journal du build APK [skip ci]" || true
          git push || true

      - name: Renommer
        id: renommer
        run: cp android/app/build/outputs/apk/debug/app-debug.apk cornscore.apk

      - name: Déposer dans les artefacts
        uses: actions/upload-artifact@v7
        with:
          name: cornscore-apk
          path: cornscore.apk

      # ---- Paquet destiné au Play Store -------------------------------
      # Ne s'active qu'une fois les quatre secrets renseignés. L'AAB n'est
      # pas installable : il part dans les artefacts, à téléverser dans la
      # console Play, et surtout pas dans une release publique.
      - name: Clé d'envoi
        id: upload_key
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            echo "Secret RELEASE_KEYSTORE_B64 absent : bundle release ignoré."
          fi

      - name: Construire le bundle
        if: steps.upload_key.outputs.ready == 'yes'
        working-directory: android
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/upload.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          gradle bundleRelease --no-daemon --stacktrace \
            -Pvc=${{ github.run_number }} \
            -Pvn=${{ steps.v.outputs.vn }}.${{ github.run_number }}

      - name: Déposer le bundle
        if: steps.upload_key.outputs.ready == 'yes'
        uses: actions/upload-artifact@v7
        with:
          name: cornscore-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # La release de téléchargement direct vient en dernier : une erreur de
      # l'API GitHub à cet endroit ne prive plus la console Play de son bundle.
      # Elle part dès que l'APK existe, bundle construit ou non. Le titre n'est
      # réécrit que s'il a changé : la réécriture à chaque passage a échoué
      # deux fois de suite en HTTP 500 côté GitHub.
      - name: Publier la release
        if: ${{ !cancelled() && steps.renommer.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          titre="ScoreToss — APK"
          notes="Dernier APK installable, reconstruit à chaque modification de l'application. Fichier : cornscore.apk"
          if actuel=$(gh release view apk --json name --jq .name 2>/dev/null); then
            if [ "$actuel" != "$titre" ]; then
              gh release edit apk --title "$titre" --notes "$notes"
            fi
          else
            gh release create apk --title "$titre" --notes "$notes"
          fi
          gh release upload apk cornscore.apk --clobber
